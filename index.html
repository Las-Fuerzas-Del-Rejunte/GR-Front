<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internal Complaint Management Web App Design</title>
    <style>
      /* Loader inicial que se muestra mientras React carga */
      #app-loader {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      
      #app-loader.loaded {
        opacity: 0;
        pointer-events: none;
      }

      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loader-text {
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        font-weight: 500;
        margin-top: 20px;
        letter-spacing: 0.5px;
      }

      .loader-logo {
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 30px;
        letter-spacing: 1px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Ocultar el root hasta que React monte */
      #root:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Loader inicial -->
    <div id="app-loader">
      <div class="loader-logo">Gestión de Reclamos</div>
      <div class="loader-spinner"></div>
      <div class="loader-text">Cargando aplicación... </div>
      <div class="loader-text">Las Fuerzas del Cielo </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
